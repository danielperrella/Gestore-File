}.pagehead{display:flex;align-items:center;justify-content:space-between;margin:36px 0 28px;gap:12px}h1{font-size:34px;letter-spacing:-1.1px;line-height:1.15;margin:0 0 9px;font-weight:650}p{color:var(--muted);line-height:1.6;margin:0}.primary{background:var(--blue);color:white;border-radius:10px;padding:12px 17px;display:inline-flex;gap:8px;align-items:center;font-weight:600}.primary:hover{background:#1747c1}.storages{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;margin-bottom:32px}.storage{text-align:left;border:1px solid var(--line);border-radius:18px;background:white;padding:23px;display:flex;gap:18px;align-items:center}.storage.main{background:var(--blue);color:white;border-color:var(--blue)}.storage.main:hover{background:#204fc9}.storage .device{border-radius:14px;background:#ffffff22;padding:14px;display:flex}.storage:not(.main) .device{background:#eef3ff;color:var(--blue)}.storage h3{font-size:17px;margin:0 0 5px}.storage p{font-size:12px;color:inherit;opacity:.8}.storage .content{flex:1}.meter{height:5px;border-radius:6px;background:#ffffff38;margin:17px 0 8px;overflow:hidden}.meter b{display:block;height:100%;width:64%;background:#fff;border-radius:6px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:28px 0 16px}h2{font-size:18px;letter-spacing:-.3px;margin:0}.textbtn{color:var(--blue);font-size:13px;padding:8px}.shortcuts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.shortcut{border:1px solid var(--line);background:white;border-radius:12px;text-align:left;padding:16px;display:flex;align-items:center;gap:12px}.foldericon{color:#ca9b32;background:#fff6df;border-radius:10px;padding:10px;display:inline-flex}.shortcut span{font-weight:600;font-size:13px}.toolbar{display:flex;align-items:center;justify-content:space-between;padding:14px 0;gap:10px;border-bottom:1px solid var(--line)}.tools{display:flex;gap:5px;align-items:center}.iconbtn{width:40px;height:40px;display:inline-flex;align-items:center <body>
<div class="app">
<aside class="sidebar"><div class="brand"><span class="logo" data-icon="folder"></span>Gestore File</div><div><small>Esplora</small><button class="nav active" data-page="home"><span data-icon="home"></span>I miei file</button><button class="nav" data-page="favorites"><span data-icon="star"></span>Preferiti</button><button class="nav" data-page="recent"><span data-icon="clock"></span>Cartelle recenti</button></div><div><small>Posizioni</small><button class="nav" data-folder="internal"><span data-icon="phone"></span>Memoria interna</button><button class="nav" data-folder="usb"><span data-icon="usb"></span>USB Kingston</button><button class="nav" id="addusb"><span data-icon="plus"></span>Aggiungi posizione</button></div><div class="bottomside"><button class="nav" data-page="trash"><span data-icon="trash"></span>Cestino<span class="count" id="trashcount">1</span></button><button class="nav" data-page="settings"><span data-icon="settings"></span>Impostazioni</button><div class="local"><b>● Tutto sul tuo dispositivo</b><br>Nessun account. Nessuna pubblicità.</div></div></aside>
<main><header class="topbar"><span>Il tuo spazio, in ordine.</span><div class="mobilebrand"><span data-icon="folder"></span>Gestore File</div><div class="pill"><i></i>Prototipo interattivo · dati demo</div></header><div id="view"></div></main>
</div>
<nav class="mobilebar" aria-label="Navigazione principale"><button data-page="home" class="active"><span data-icon="home"></span>I miei file</button><button data-page="favorites"><span data-icon="star"></span>Preferiti</button><button data-page="trash"><span data-icon="trash"></span>Cestino</button><button data-page="settings"><span data-icon="settings"></span>Impostazioni</button></nav>
<div class="actions" id="actions" hidden></div><dialog id="dialog"></dialog><div class="toast" id="toast" role="status" hidden></div>
<script>
const paths={folder:'M3 7V5h6l2 2h10v13H3Z',home:'m3 11 9-8 9 8M5 10v11h5v-7h4v7h5V10',star:'m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9Z',clock:'M12 8v5l3 2M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0',phone:'M7 2h10v20H7ZM11 18h2',usb:'M8 8h8v13H8ZM10 8V2h4v6M10 5h4',plus:'M12 5v14M5 12h14',trash:'M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7',settings:'M9 3h6l1 4 4 2v6l-4 2-1 4H9l-1-4-4-2V9l4-2ZM15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0',grid:'M3 3h7v7H3ZM14 3h7v7h-7ZM3 14h7v7H3ZM14 14h7v7h-7',list:'M8 5h13M8 12h13M8 19h13M3 5h1M3 12h1M3 19h1',more:'M12 4h.01M12 12h.01M12 20h.01',copy:'M8 8h13v13H8ZM4 16H2V2h14v2',move:'M4 12h16m-6-6 6 6-6 6',close:'m6 6 12 12M6 18 18 6',back:'m14 5-7 7 7 7',check:'m5 12 4 4L19 6',file:'M5 2h9l5 5v15H5ZM14 2v6h5',chart:'M4 21V11h4v10M10 21V3h4v18M16 21v-7h4v7'};
const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[n]||paths.file}"/></svg>`;
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let seq=30;let files=[{id:1,name:'Download',parent:'internal',kind:'folder',key:'download'},{id:2,name:'Documenti',parent:'internal',kind:'folder',key:'documents'},{id:3,name:'DCIM',parent:'internal',kind:'folder',key:'dcim'},{id:4,name:'Music',parent:'internal',kind:'folder',key:'music'},{id:5,name:'Progetti',parent:'internal',kind:'folder',key:'projects'},{id:6,name:'Android',parent:'internal',kind:'folder',key:'android'},{id:7,name:'Guida del dispositivo.pdf',parent:'internal',kind:'pdf',size:2400000},{id:8,name:'Documenti viaggio',parent:'usb',kind:'folder',key:'travel'},{id:9,name:'Backup_ottobre.zip',parent:'usb',kind:'zip',size:420000000},{id:10,name:'Biglietti_Roma.pdf',parent:'download',kind:'pdf',size:840000},{id:11,name:'Montagna_2026.jpg',parent:'download',kind:'jpg',size:4800000},{id:12,name:'Archivio_progetto.zip',parent:'download',kind:'zip',size:28000000},{id:13,name:'Appunti.txt',parent:'documents',kind:'txt',size:3200},{id:14,name:'Contratto.pdf',parent:'documents',kind:'pdf',size:1600000},{id:15,name:'IMG_20261018.jpg',parent:'dcim',kind:'jpg',size:6200000},{id:16,name:'Registrazione.mp3',parent:'music',kind:'mp3',size:9200000},{id:17,name:'.config',parent:'internal',kind:'txt',size:1500},{id:18,name:'Note precedenti.txt',parent:'trash',original:'documents',kind:'txt',size:2100}].map(f=>({...f,date:'18 ott 2026'}));
let page='home',folder='internal',selected=new Set(),grid=false,sort='name',clipboard=null,favorites=['documents','download'],recent=['download','documents'],showHidden=false,timer;
const folderName=k=>({internal:'Memoria interna',usb:'USB Kingston'}[k]||files.find(f=>f.key===k)?.name||'Cartella');
const size=n=>!n?'—':n>=1e9?(n/1e9).toFixed(1)+' GB':n>=1e6?(n/1e6).toFixed(1)+' MB':Math.ceil(n/1000)+' KB';
function hydrate(){document.querySelectorAll('[data-icon]').forEach(e=>e.innerHTML=icon(e.dataset.icon))}
function navigate(p,f){page=p;if(p==='home')folder='internal';if(f){folder=f;recent=[f,...recent.filter(x=>x!==f)].slice(0,8)}selected.clear();render()}
function crumbs(k){let chain=[];while(k){chain.unshift(k);k=files.find(f=>f.key===k)?.parent}return chain.map(k=>`<button data-folder="${esc(k)}">${esc(folderName(k))}</button>`).join('<span>›</span>')}
function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#trashcount').textContent=files.filter(f=>f.parent==='trash').length;
const home=page==='home',browsing=home||page==='folder',trash=page==='trash';let title=home?'I miei file':page==='folder'?folderName(folder):({favorites:'Preferiti',recent:'Cartelle recenti',trash:'Cestino',settings:'Impostazioni'}[page]);
$('#view').innerHTML=`<div class="pagehead"><div><h1>${esc(title)}</h1><p>${home?'Tutto quello che ti serve, a portata di mano.':trash?'I file restano qui finché decidi tu.':page==='settings'?'Un gestore file, come piace a te.':page==='favorites'?'Le cartelle che vuoi ritrovare subito.':page==='recent'?'Riprendi da dove eri rimasto.':'Esplora e organizza i tuoi contenuti.'}</p></div>${browsing?`<button class="primary" id="newfolder">${icon('plus')}Nuova cartella</button>`:''}</div>`;
if(home)$('#view').innerHTML+=`<div class="storages"><button class="storage main" data-folder="internal"><span class="device">${icon('phone')}</span><div class="content"><h3>Memoria interna</h3><p>Xiaomi 11T Pro</p><div class="meter"><b></b></div><p>164 GB di 256 GB utilizzati</p></div>${icon('move')}</button><button class="storage" data-folder="usb"><span class="device">${icon('usb')}</span><div class="content"><h3>USB Kingston</h3><p>Collegata · 32 GB</p><p style="margin-top:13px;color:var(--blue)">Apri la memoria esterna</p></div>${icon('move')}</button></div><div class="sectionhead"><h2>Le tue cartelle</h2><button class="textbtn" data-page="favorites">Vedi preferiti</button></div><div class="shortcuts">${['download','documents','dcim','music'].map(k=>`<button class="shortcut" data-folder="${k}"><span class="foldericon">${icon('folder')}</span><span>${esc(folderName(k))}</span></button>`).join('')}</div><div class="sectionhead"><h2>Nella memoria interna</h2><button class="textbtn" id="analyze">Analizza spazio</button></div>`;
if(page==='settings'){settings();hydrate();updateActions();return}
let items=browsing?files.filter(f=>f.parent===folder):trash?files.filter(f=>f.parent==='trash'):(page==='favorites'?favorites:recent).map(k=>files.find(f=>f.key===k)||({id:k,name:folderName(k),key:k,kind:'folder',date:'18 ott 2026'}));items=items.filter(f=>showHidden||!f.name.startsWith('.'));items.sort((a,b)=>(a.kind==='folder'?0:1)-(b.kind==='folder'?0:1)||(sort==='size'?(b.size||0)-(a.size||0):sort==='type'?a.kind.localeCompare(b.kind)||a.name.localeCompare(b.name):sort==='date'?b.id-a.id:a.name.localeCompare(b.name)));
$('#view').innerHTML+=`<div class="toolbar"><div class="crumbs">${browsing?crumbs(folder):`${items.length} elementi`}</div><div class="tools"><select id="sort" aria-label="Ordina file"><option value="name">Nome A–Z</option><option value="date">Più recenti</option><option value="size">Dimensione</option><option value="type">Tipo</option></select><button class="iconbtn ${!grid?'active':''}" id="list" aria-label="Vista elenco">${icon('list')}</button><button class="iconbtn ${grid?'active':''}" id="grid" aria-label="Vista griglia">${icon('grid')}</button>${browsing?`<button class="iconbtn" id="foldermenu" aria-label="Menu cartella">${icon('more')}</button>`:''}</div></div>${!grid&&items.length?'<div class="tablehead"><span>Nome</span><span>Modificato</span><span>Dimensione</span><span></span></div>':''}<div id="files" class="${grid?'gridview':''}">${items.map(f=>`<div class="row ${selected.has(f.id)?'selected':''}"><div class="filename"><input type="checkbox" data-select="${f.id}" aria-label="Seleziona ${esc(f.name)}" ${selected.has(f.id)?'checked':''}><button class="fileopen" data-open="${f.id}"><span class="fileicon ${f.kind}">${f.kind==='folder'?icon('folder'):f.kind.toUpperCase()}</span><span><strong>${esc(f.name)}</strong><small>${f.kind==='folder'?'Cartella':f.kind.toUpperCase()+' · '+size(f.size)}</small></span></button></div><span class="date">${f.date}</span><span class="size">${size(f.size)}</span><button class="iconbtn" data-more="${f.id}" aria-label="Azioni per ${esc(f.name)}">${icon('more')}</button></div>`).join('')||`<div class="empty">${icon('folder')}<p>${trash?'Il cestino è vuoto.':page==='favorites'?'Aggiungi una cartella ai preferiti dal suo menu.':'Questa cartella è vuota.'}</p>${browsing?'<button class="textbtn" id="emptycreate">Crea una cartella</button>':''}</div>`}</div><p class="statusline">${items.length} elementi${browsing?' · Nessuna scansione automatica dei contenuti':''}</p>${trash&&items.length?'<button class="textbtn" id="emptytrash">Svuota cestino</button>':''}<p class="demo">Proposta di interfaccia · contenuti e capacità delle memorie dimostrativi</p>`;
$('#sort').value=sort;hydrate();updateActions()}
function updateActions(){let bar=$('#actions');bar.hidden=!selected.size&&!clipboard;if(selected.size){bar.innerHTML=`<button id="clear" aria-label="Annulla selezione">${icon('close')}</button><label>${selected.size} selezionati</label>${page==='trash'?`<button data-action="restore">${icon('back')}Ripristina</button><button data-action="delete">${icon('trash')}Elimina</button>`:`<button data-action="copy">${icon('copy')}Copia</button><button data-action="move">${icon('move')}Sposta</button><button data-action="delete">${icon('trash')}Elimina</button><button data-action="more">${icon('more')}Altro</button>`}`}else if(clipboard){bar.innerHTML=`<button id="cancelclip" aria-label="Annulla trasferimento">${icon('close')}</button><label>${clipboard.ids.length} da ${clipboard.move?'spostare':'copiare'}</label><button id="paste" class="primary">${icon('check')}Incolla qui</button>`}}
function toast(t){clearTimeout(timer);$('#toast').textContent=t;$('#toast').hidden=false;timer=setTimeout(()=>$('#toast').hidden=true,3200)}
function modal(title,body,action,label='Conferma'){const d=$('#dialog');d.innerHTML=`<h2>${esc(title)}</h2>${body}<div class="footer"><button id="dismiss">${action?'Annulla':'Chiudi'}</button>${action?`<button class="primary" id="confirm">${esc(label)}</button>`:''}</div>`;d.showModal();$('#dismiss').onclick=()=>d.close();if(action)$('#confirm').onclick=()=>{if(action()!==false)d.close()};hydrate()}
function newFolder(){modal('Nuova cartella','<p>Crea una cartella in '+esc(folderName(folder))+'.</p><input type="text" id="name" aria-label="Nome cartella" placeholder="Nome cartella" maxlength="100"><p id="error" role="alert"></p>',()=>{let name=$('#name').value.trim();if(!valid(name,folder))return false;files.push({id:++seq,key:'folder'+seq,name,parent:folder,kind:'folder',date:'Oggi'});render();toast('Cartella creata')},'Crea cartella');$('#name').focus()}
function valid(n,p,except){if(!n||/[\\/]/.test(n)||n==='.'||n==='..'||files.some(f=>f.parent===p&&f.name===n&&f.id!==except)){($('#error')||$('#toast')).textContent='Inserisci un nome valido e diverso da quelli presenti.';return false}return true}
function settings(){$('#view').innerHTML+=`<div style="max-width:620px;background:white;border:1px solid var(--line);padding:8px 24px;border-radius:16px"><label class="detail"><div>Mostra file nascosti<p style="font-size:12px">Include i nomi che iniziano con un punto</p></div><input type="checkbox" id="hiddenfiles" ${showHidden?'checked':''}></label><label class="detail"><div>Dimensione testo</div><select id="fontsize"><option value="15">Standard</option><option value="17">Grande</option><option value="19">Molto grande</option></select></label><button class="option" id="privacy" style="width:100%;text-align:left;padding:20px 0">Privacy e sicurezza <span style="float:right">›</span></button></div><p class="demo">Nel prototipo: preferenze valide finché la pagina rimane aperta.<br>Il tema proposto è quello chiaro. Operazioni interrotte e tema scuro restano da progettare.</p>`;$('#hiddenfiles').onchange=e=>{showHidden=e.target.checked;toast('Preferenza aggiornata')};$('#fontsize').value=parseInt(document.documentElement.style.fontSize)||15;$('#fontsize').onchange=e=>{document.documentElement.style.fontSize=e.target.value+'px';document.querySelectorAll('.fileopen strong').forEach(x=>x.style.fontSize='1rem')};$('#privacy').onclick=()=>modal('Privacy e sicurezza','<p>L’app Android non richiede Internet, account o tracciamento. Questo HTML usa soltanto dati dimostrativi in memoria e non accede ai file del dispositivo.</p>')}
function analyze(){modal('Spazio della cartella',`<p>Analisi dimostrativa di ${esc(folderName(folder))}. Nell’app la scansione viene avviata soltanto su richiesta.</p><div class="bars"><i></i><i></i><i></i></div><div class="detail"><span>Archivi ZIP</span><b>53%</b></div><div class="detail"><span>Immagini</span><b>29%</b></div><div class="detail"><span>Altri file</span><b>18%</b></div><p style="margin-top:18px">Valori illustrativi, non misurati sul dispositivo.</p>`)}
function details(f){modal(f.name,`<div class="detail"><span>Tipo</span><b>${esc(f.kind==='folder'?'Cartella':f.kind.toUpperCase())}</b></div><div class="detail"><span>Dimensione</span><b>${size(f.size)}</b></div><div class="detail"><span>Modificato</span><b>${f.date}</b></div><div class="detail"><span>Posizione</span><b>${esc(folderName(f.parent))}</b></div><p style="margin-top:18px">${f.kind==='folder'?'Apri la cartella per esplorarne i contenuti.':'Nell’app il file si apre con un’app esterna. Il prototipo non contiene il file reale.'}</p>`)}
function more(ids){let f=files.find(x=>x.id===ids[0]);modal(ids.length>1?'Azioni su '+ids.length+' elementi':f.name,`<button class="option" id="rename">${icon('file')}Rinomina${ids.length>1?' con prefisso':''}</button><button class="option" id="zip">${icon('folder')}Crea archivio ZIP</button>${f.kind==='folder'?`<button class="option" id="favorite">${icon('star')}${favorites.includes(f.key)?'Rimuovi dai':'Aggiungi ai'} preferiti</button>`:''}${f.kind==='zip'?'<button class="option" id="extract">Estrai in una nuova cartella</button>':''}<button class="option" id="details">${icon('file')}Dettagli</button>`);$('#rename').onclick=()=>{ $('#dialog').close();setTimeout(()=>rename(ids),0)};$('#zip').onclick=()=>{ $('#dialog').close();setTimeout(()=>zip(ids),0)};if($('#favorite'))$('#favorite').onclick=()=>{favorites=favorites.includes(f.key)?favorites.filter(k=>k!==f.key):[...favorites,f.key];$('#dialog').close();render();toast('Preferiti aggiornati')};if($('#extract'))$('#extract').onclick=()=>{$('#dialog').close();setTimeout(()=>modal('Estrai archivio','<p>Verrà creata una cartella dimostrativa accanto all’archivio. Nessun contenuto ZIP reale verrà letto.</p>',()=>{files.push({id:++seq,name:f.name.replace(/\.zip$/i,'')+' estratto',parent:f.parent,kind:'folder',key:'folder'+seq,date:'Oggi'});render();toast('Cartella dimostrativa creata')},'Estrai'),0)};$('#details').onclick=()=>{$('#dialog').close();setTimeout(()=>details(f),0)}}
function rename(ids){const chosen=files.filter(f=>ids.includes(f.id));modal(ids.length>1?'Rinomina multipla':'Rinomina',`<p>${ids.length>1?'Aggiungi un prefisso ai nomi selezionati.':'Scegli il nuovo nome del file o della cartella.'}</p><input type="text" id="name" aria-label="${ids.length>1?'Prefisso':'Nuovo nome'}" value="${ids.length===1?esc(chosen[0].name):''}"><p id="preview"></p><p id="error" role="alert"></p>`,()=>{let n=$('#name').value.trim();if(!n)return false;const names=chosen.map(f=>ids.length>1?n+f.name:n);if(!chosen.every((f,i)=>valid(names[i],f.parent,f.id)))return false;chosen.forEach((f,i)=>f.name=names[i]);selected.clear();render();toast('Nomi aggiornati')},'Salva');$('#name').oninput=()=>$('#preview').textContent=ids.length>1?'Anteprima: '+$('#name').value+chosen[0].name:'';$('#name').focus()}
function zip(ids){modal('Crea archivio ZIP','<p>Verrà aggiunto un archivio dimostrativo. I contenuti non vengono compressi.</p><input type="text" id="name" value="Archivio.zip" aria-label="Nome archivio"><p id="error" role="alert"></p>',()=>{let name=$('#name').value.trim();if(!name.endsWith('.zip'))name+='.zip';if(!valid(name,folder))return false;files.push({id:++seq,name,parent:folder,kind:'zip',size:files.filter(f=>ids.includes(f.id)).reduce((s,f)=>s+(f.size||0),0),date:'Oggi'});selected.clear();render();toast('Archivio dimostrativo creato')},'Crea ZIP')}
function remove(ids){const permanent=page==='trash'||folder==='usb'||files.some(f=>ids.includes(f.id)&&f.parent==='usb');modal(permanent?'Elimina definitivamente?':'Sposta nel cestino?',`<p>${ids.length} elementi ${permanent?'verranno rimossi dai dati demo. Su USB l’eliminazione è definitiva.':'saranno recuperabili dal cestino.'}</p>`,()=>{if(permanent)files=files.filter(f=>!ids.includes(f.id));else files.filter(f=>ids.includes(f.id)).forEach(f=>{f.original=f.parent;f.parent='trash'});selected.clear();render();toast(permanent?'Elementi eliminati':'Elementi spostati nel cestino')},permanent?'Elimina':'Sposta nel cestino')}
function restore(ids){modal('Ripristina elementi','<p>I file torneranno alla posizione originale. Eventuali nomi duplicati saranno conservati con un nuovo nome.</p>',()=>{files.filter(f=>ids.includes(f.id)).forEach(f=>{f.parent=f.original||'internal';if(files.some(x=>x.id!==f.id&&x.parent===f.parent&&x.name===f.name))f.name='Ripristinato_'+f.id+'_'+f.name});selected.clear();render();toast('Elementi ripristinati')},'Ripristina')}
function paste(){if(!['folder','home'].includes(page)){toast('Apri una cartella di destinazione');return}let sources=files.filter(f=>clipboard.ids.includes(f.id));let ancestors=[folder],p=folder;while(files.find(f=>f.key===p)){p=files.find(f=>f.key===p).parent;ancestors.push(p)}if(sources.some(f=>f.kind==='folder'&&ancestors.includes(f.key))){toast('Scegli una destinazione esterna alla cartella selezionata');return}modal(clipboard.move?'Sposta qui':'Copia qui',`<p>${sources.length} elementi in ${esc(folderName(folder))}. In caso di nomi uguali, scegli come procedere.</p><label>File già presenti<select id="conflict"><option value="both">Conserva entrambi</option><option value="skip">Salta</option></select></label>`,()=>{let mode=$('#conflict').value,move=clipboard.move;function transfer(f,dest){let duplicate=files.some(x=>x.parent===dest&&x.name===f.name);if(duplicate&&mode==='skip')return;let name=duplicate?'Copia_'+(++seq)+'_'+f.name:f.name;if(move){f.parent=dest;f.name=name}else{let key=f.kind==='folder'?'folder'+(++seq):undefined;let copy={...f,id:++seq,name,parent:dest,key,date:'Oggi'};let children=files.filter(x=>x.parent===f.key&&f.key);files.push(copy);children.forEach(c=>transfer(c,key))}}sources.forEach(f=>transfer(f,folder));clipboard=null;render();toast(move?'Spostamento demo completato':'Copia demo completata')},clipboard.move?'Sposta':'Copia')}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.page){navigate(b.dataset.page);return}if(b.dataset.folder){navigate('folder',b.dataset.folder);return}if(b.dataset.open){let f=files.find(x=>String(x.id)===b.dataset.open);if(!f){navigate('folder',b.dataset.open);return}if(page==='trash'){selected=new Set([f.id]);render();return}f.kind==='folder'?navigate('folder',f.key):details(f);return}if(b.dataset.more){more([Number(b.dataset.more)]);return}if(b.dataset.action){let ids=[...selected];switch(b.dataset.action){case'copy':case'move':clipboard={ids,move:b.dataset.action==='move'};selected.clear();render();toast('Apri la destinazione, poi scegli Incolla qui');break;case'delete':remove(ids);break;case'restore':restore(ids);break;case'more':more(ids)}return}switch(b.id){case'newfolder':case'emptycreate':newFolder();break;case'clear':selected.clear();render();break;case'cancelclip':clipboard=null;updateActions();break;case'paste':paste();break;case'grid':grid=true;render();break;case'list':grid=false;render();break;case'analyze':analyze();break;case'emptytrash':remove(files.filter(f=>f.parent==='trash').map(f=>f.id));break;case'addusb':modal('Aggiungi posizione','<p>Nell’app si aprirà il selettore Android per concedere l’accesso a una memoria USB o a una cartella. Qui puoi esplorare la USB dimostrativa.</p>',()=>navigate('folder','usb'),'Esplora USB demo');break;case'foldermenu':modal('Questa cartella',`<button class="option" id="analyzemenu">${icon('chart')}Analizza spazio</button><button class="option" id="selectall">${icon('check')}Seleziona tutti</button>`);$('#analyzemenu').onclick=()=>{$('#dialog').close();setTimeout(analyze,0)};$('#selectall').onclick=()=>{selected=new Set(files.filter(f=>f.parent===folder&&(showHidden||!f.name.startsWith('.'))).map(f=>f.id));$('#dialog').close();render()};break}});
document.addEventListener('change',e=>{if(e.target.dataset.select){let id=Number(e.target.dataset.select);e.target.checked?selected.add(id):selected.delete(id);e.target.closest('.row').classList.toggle('selected',e.target.checked);updateActions()}if(e.target.id==='sort'){sort=e.target.value;render()}});
render();hydrate();
</script>
</body></html>
